# Nginx configuration for a React SPA (Single Page Application)
server {
    listen 80;
    server_name localhost;

    # Root directory where our built files live (copied from Dockerfile).
    root /usr/share/nginx/html;
    index index.html;

    # This is the KEY config for React Router.
    # Without it, refreshing on /dashboard would give a 404
    # because Nginx would look for a real file at that path.
    # "try_files" tells Nginx: try the exact file, then the exact directory,
    # then fall back to index.html and let React Router handle routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container.
    # Any request to /api/... is forwarded to the backend service.
    # "backend" here matches the service name in docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets aggressively for performance.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
